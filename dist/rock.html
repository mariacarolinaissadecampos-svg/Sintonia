<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dacec4">
  <title>Sintonia • edição rock</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="rock.css">
<link rel="icon" type="image/png" href="assets/app-icon.png"><link rel="apple-touch-icon" href="assets/app-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Sintonia"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body>
  <main id="app" class="rock-page">
    <section class="screen">
      <header>
        <a href="./" class="icon rock-back" aria-label="Voltar ao Sintonia">←</a>
        <span class="wordmark">SINTONIA<span class="tiny-star">✦</span><span class="deezer">DEEZER</span></span>
      </header>
      <div class="rock-product">
        <div class="cover rock-cover" aria-hidden="true">
          <img class="edition-art" src="assets/edition-rock.png" alt="">
          <small>S I N T O N I A</small>
        </div>
        <h1>Sintonia <em>rock.</em></h1>
        <p>Histórias do universo do rock para ler, contar e interpretar em grupo.</p>
        <p class="rock-price">R$ 39,90</p>
        <button class="primary rock-buy" disabled>Comprar edição rock</button>
        <small class="hint">Compra disponível em breve.</small>
      </div>
    </section>
  </main>
</body>
</html>
